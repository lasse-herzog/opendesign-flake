name: Check flake

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Configure binary cache
        uses: cachix/cachix-action@v17
        with:
          name: opendesign
          skipPush: true
      - run: nix flake check --all-systems --no-build
      - run: nix build .#default -L
      - run: ./result/bin/od --help
      - name: Smoke-test the Electron app
        run: nix shell --inputs-from . nixpkgs#nodejs_24 nixpkgs#xvfb-run --command xvfb-run -a node scripts/smoke-electron.mjs ./result --no-sandbox --disable-gpu --ozone-platform=x11
      - name: Cache validated build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CACHIX_CACHE: opendesign
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          : "${CACHIX_AUTH_TOKEN:?Set the CACHIX_AUTH_TOKEN repository secret}"
          cachix push "$CACHIX_CACHE" "$(readlink -f result)"
