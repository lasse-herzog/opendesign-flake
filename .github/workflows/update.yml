name: Update Open Design

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-open-design
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: cachix/install-nix-action@v31
      - name: Update and build the latest stable release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update.py
          if git diff --quiet -- nix/release.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke-test the updated Electron app
        if: steps.update.outputs.changed == 'true'
        run: |
          package=$(nix build .#default --no-link --print-out-paths)
          nix shell --inputs-from . nixpkgs#nodejs_24 nixpkgs#xvfb-run --command xvfb-run -a node scripts/smoke-electron.mjs "$package" --no-sandbox --disable-gpu --ozone-platform=x11
      - name: Commit validated update
        run: |
          if git diff --quiet -- nix/release.json; then
            exit 0
          fi
          version=$(python3 -c 'import json; print(json.load(open("nix/release.json"))["version"])')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nix/release.json
          git commit -m "open-design: update to $version"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
